name: Trading Bot Automator

on:
  schedule:
    # Hii inaiambia GitHub iwashe bot yako kila baada ya saa 1
    - cron: '0 * * * *'
  workflow_dispatch: # Inakuwezesha kuiwasha kwa mikono wakati wowote

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Bot Script
        run: |
          python bot.py
